<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title and Favicon -->
  <title>Be Well U</title>
  <link rel="icon" type="image/png" href="/BeWellU/logo.png" />

  <!-- App Icons for mobile PWA feel -->
  <link rel="apple-touch-icon" href="/BeWellU/logo.png" />
  <meta name="theme-color" content="#121212" />

  <!-- App-Like Appearance -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Font & Styling -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #000000, #000000);
      color: #fff;
      overflow: hidden;
    }

    /* Loader Container */
    #loader {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      background: linear-gradient(135deg, #000000, #000000);
      z-index: 9999;
      animation: fadeOut 0.8s ease-in-out 2.2s forwards;
    }

    /* Logo Animation */
    #loader img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      animation: bounce 2s infinite ease-in-out;
      filter: drop-shadow(0 0 20px #00c6ff);
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid #d1d1d1;
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
    }


    /* Text under logo */
    .loader-text {
      margin-top: 15px;
      font-weight: 500;
      letter-spacing: 1px;
      font-size: 1.1rem;
      color: #00c6ff;
      opacity: 0;
      animation: fadeInUp 1.4s ease forwards 0.8s;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* React app container */
    #root {
      height: 100%;
      width: 100%;
      opacity: 0;
      animation: revealApp 0.8s ease-in-out 2.5s forwards;
    }

    @keyframes revealApp {
      to {
        opacity: 1;
      }
    }

    /* Light mode support */
    @media (prefers-color-scheme: light) {
      body {
        background: linear-gradient(135deg, #f7f7f7, #e3e3e3);
        color: #000000;
      }

      #loader {
        background: linear-gradient(135deg, #f7f7f7, #e3e3e3);
      }

      .loader-text {
        color: #007aff;
      }

      #loader img {
        filter: drop-shadow(0 0 20px #007aff);
      }
    }

    /* Mobile optimization */
    @media (max-width: 600px) {
      #loader img {
        width: 90px;
        height: 90px;
      }

      .loader-text {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <!-- Splash / Loader -->
  <div id="loader">
    <div class="spinner"></div>
  </div>

  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const loader = document.getElementById("loader");
      setTimeout(() => {
        loader.classList.add("hide");
      }, 300);
    });
  </script>
</body>



</html>
